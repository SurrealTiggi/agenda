# Maintains a draft release that absorbs every merged PR; publishing the
# draft creates the vX.Y.Z tag, which triggers .github/workflows/release.yml.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: Features
    labels: [feature]
  - title: Fixes
    labels: [fix]
  - title: Other
    labels: [chore, docs, ci]

# Label PRs from their conventional-commit titles so categories and the
# version bump need no manual labelling.
autolabeler:
  - label: feature
    title: ['/^feat(\(|!|:)/i']
  - label: fix
    title: ['/^fix(\(|!|:)/i']
  - label: docs
    title: ['/^docs(\(|!|:)/i']
  - label: ci
    title: ['/^ci(\(|!|:)/i']
  - label: chore
    title: ['/^(chore|refactor|test|build)(\(|!|:)/i']

version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature]
  patch:
    labels: [fix, chore, docs, ci]
  default: patch

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
template: |
  ## What changed

  $CHANGES
